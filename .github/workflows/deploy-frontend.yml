name: Deploy Frontend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - 'src/WindTurbineMonitor.React/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: ./src/WindTurbineMonitor.React
      run: npm install

    - name: Build
      working-directory: ./src/WindTurbineMonitor.React
      run: npm run build

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: windturbine-frontend
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_FRONTEND }}
        package: ./src/WindTurbineMonitor.React/dist
