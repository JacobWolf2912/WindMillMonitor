name: Deploy Frontend to Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build and Deploy
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/src/WindTurbineMonitor.React
        npm install
        npm run build

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v2
      with:
        app-name: windturbine-frontend
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_FRONTEND }}
        package: ${{ github.workspace }}/src/WindTurbineMonitor.React/dist
