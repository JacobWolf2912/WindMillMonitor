name: Deploy API to Azure

on:
  push:
    branches: [ main ]
    paths:
      - 'src/WindTurbineMonitor.Api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/WindTurbineMonitor.Api/WindTurbineMonitor.Api.csproj

    - name: Build
      run: dotnet build src/WindTurbineMonitor.Api/WindTurbineMonitor.Api.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish src/WindTurbineMonitor.Api/WindTurbineMonitor.Api.csproj -c Release -o ./api-publish

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: windturbine-api
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_API }}
        package: ./api-publish
